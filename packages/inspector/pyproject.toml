[build-system]
requires = ["setuptools>=63", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name            = "mcs-inspector"
version         = "0.1.3"
description     = "Interactive CLI inspector for any MCS driver -- inspect tools, test connections, execute calls."
readme          = "README.md"
requires-python = ">=3.11"
license         = "Apache-2.0"
keywords        = ["mcs", "modelcontextstandard", "inspector", "cli", "debug"]
authors         = [{ name = "Danny Gerst", email = "danny@dannygerst.de" }]
license-files   = ["LICENSE"]
classifiers     = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]

urls = {"Homepage" = "https://www.modelcontextstandard.io", "Source" = "https://github.com/modelcontextstandard/python-sdk"}

dependencies = [
    "mcs-driver-core>=0.3.0",
    "rich>=13",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
mailread = ["mcs-driver-mailread>=0.1"]
mailsend = ["mcs-driver-mailsend>=0.1"]
mail     = ["mcs-driver-mail>=0.1"]
rest      = ["mcs-driver-rest>=0.2"]
websearch = ["mcs-driver-websearch>=0.1"]
webfetch  = ["mcs-driver-webfetch>=0.1"]
# The glass summarizer in the webfetch inspector: condensation model wiring.
summarize = ["mcs-types-summarizer>=0.1", "mcs-adapter-llm-completion>=0.1"]
all       = ["mcs-inspector[mail,rest,websearch,webfetch,summarize]"]

[project.scripts]
mcs-inspect = "mcs.inspector.__main__:main"

[tool.uv.sources]
mcs-driver-core     = { workspace = true }
mcs-driver-mailread = { workspace = true }
mcs-driver-websearch = { workspace = true }
mcs-driver-webfetch = { workspace = true }
mcs-types-summarizer = { workspace = true }
mcs-adapter-llm-completion = { workspace = true }
mcs-driver-mailsend = { workspace = true }
mcs-driver-mail     = { workspace = true }
mcs-driver-rest     = { workspace = true }

[tool.setuptools.packages.find]
where = ["src"]
