[build-system]
requires = ["setuptools>=63", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name            = "mcs-driver-webfetch"
version         = "0.1.0"
description     = "Web page fetching driver for the Model Context Standard -- lets an LLM read any URL as text."
readme          = "README.md"
requires-python = ">=3.9"
license         = "Apache-2.0"
keywords        = ["mcs", "modelcontextstandard", "driver", "web", "fetch", "scraping"]
authors         = [{ name = "Danny Gerst", email = "danny@dannygerst.de" }]
license-files   = ["LICENSE"]
classifiers     = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]

urls = {"Homepage" = "https://www.modelcontextstandard.io", "Source" = "https://github.com/modelcontextstandard/python-sdk"}

dependencies = [
    "mcs-driver-core>=0.4.0",
    "mcs-types-web>=0.1",
]

[project.optional-dependencies]
http = ["mcs-adapter-http>=0.3"]
# Markdown needs an established stack, not hand-rolled parsing: nh3 sanitises
# (bleach is end-of-life since 6.4.0 / June 2026 -- archived, no further security
# releases), markdownify converts. Optional because format="text" works without.
markdown = ["nh3>=0.2", "markdownify>=1.1"]
# Readability-grade extraction. Optional on purpose: it is the right choice for
# articles and the wrong one for listings, so it must not be a hard dependency.
text = ["trafilatura>=1.8"]
full = ["nh3>=0.2", "markdownify>=1.1", "trafilatura>=1.8"]

[tool.uv.sources]
mcs-driver-core   = { workspace = true }
mcs-types-web     = { workspace = true }
mcs-adapter-http   = { workspace = true }

[tool.setuptools.packages.find]
where = ["src"]
