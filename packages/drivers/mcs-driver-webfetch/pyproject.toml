[build-system]
requires = ["setuptools>=63", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name            = "mcs-driver-webfetch"
version         = "0.1.0"
description     = "Web page fetching driver for the Model Context Standard -- lets an LLM read any URL as text."
readme          = "README.md"
requires-python = ">=3.9"
license         = "Apache-2.0"
keywords        = ["mcs", "modelcontextstandard", "driver", "web", "fetch", "scraping"]
authors         = [{ name = "Danny Gerst", email = "danny@dannygerst.de" }]
license-files   = ["LICENSE"]
classifiers     = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]

urls = {"Homepage" = "https://www.modelcontextstandard.io", "Source" = "https://github.com/modelcontextstandard/python-sdk"}

dependencies = [
    "mcs-driver-core>=0.4.0",
    "mcs-types-web>=0.1",
    # Markdown needs an established stack, not hand-rolled parsing: nh3 sanitises
    # (bleach is end-of-life since 6.4.0 / June 2026 -- archived, no further
    # security releases), markdownify converts.
    #
    # Required, not optional: format="markdown" is advertised in the tool schema,
    # so a model will pick it -- and an optional dependency would turn that choice
    # into a runtime error no retry can fix. An extra is only honest when its
    # absence *degrades* something (see text= below); here it would remove an
    # offered capability. Cheap besides: nh3 pulls nothing, markdownify two small
    # pure-Python packages.
    "nh3>=0.2",
    "markdownify>=1.1",
]

[project.optional-dependencies]
http = ["mcs-adapter-http>=0.3"]
# Readability-grade extraction. Optional on purpose, and legitimately so: without
# it the BestOf chain simply votes for another extractor, so its absence costs
# quality, never a capability. It is also the one heavy dependency here (lxml and
# six more), and it is the right choice for articles but the wrong one for
# listings -- so it must not be forced on everyone.
text = ["trafilatura>=1.8"]
# Everything optional, for callers who do not want to name the parts.
full = ["trafilatura>=1.8"]

[tool.uv.sources]
mcs-driver-core   = { workspace = true }
mcs-types-web     = { workspace = true }
mcs-adapter-http   = { workspace = true }

[tool.setuptools.packages.find]
where = ["src"]
