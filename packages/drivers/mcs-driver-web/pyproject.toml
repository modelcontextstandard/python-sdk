[build-system]
requires = ["setuptools>=63", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name            = "mcs-driver-web"
version         = "0.1.0"
description     = "Composite web driver for the Model Context Standard -- search the web and read pages through one driver."
readme          = "README.md"
requires-python = ">=3.11"
license         = "Apache-2.0"
keywords        = ["mcs", "modelcontextstandard", "driver", "web", "search", "fetch"]
authors         = [{ name = "Danny Gerst", email = "danny@dannygerst.de" }]
license-files   = ["LICENSE"]
classifiers     = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]

urls = {"Homepage" = "https://www.modelcontextstandard.io", "Source" = "https://github.com/modelcontextstandard/python-sdk"}

dependencies = [
    "mcs-driver-core>=0.4.0",
    "mcs-driver-webfetch>=0.1",
    "mcs-driver-websearch>=0.1",
]

[project.optional-dependencies]
# Article-grade extraction for the fetch half. Safe markdown is not here: it is a
# required dependency of mcs-driver-webfetch, because an advertised format must not
# depend on how the package was installed.
full = ["mcs-driver-webfetch[full]>=0.1"]

[tool.uv.sources]
mcs-driver-core      = { workspace = true }
mcs-driver-webfetch  = { workspace = true }
mcs-driver-websearch = { workspace = true }

[tool.setuptools.packages.find]
where = ["src"]
