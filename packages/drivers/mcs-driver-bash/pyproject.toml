[build-system]
requires = ["setuptools>=63", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name            = "mcs-driver-bash"
version         = "0.2.0"
description     = "MCS Bash Driver — one bash tool over an injected execution modality (local, Docker, SSH, ...)."
requires-python = ">=3.11"
license         = "Apache-2.0"
dependencies    = ["mcs-driver-core>=0.4.0"]

[tool.uv.sources]
mcs-driver-core = { workspace = true }

[tool.setuptools.packages.find]
where = ["src"]
