[build-system]
requires = ["setuptools>=63", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name            = "mcs-driver-websearch"
version         = "0.1.0"
description     = "Web search driver for the Model Context Standard -- lets an LLM search the web via any Tavily-compatible API."
readme          = "README.md"
requires-python = ">=3.11"
license         = "Apache-2.0"
keywords        = ["mcs", "modelcontextstandard", "driver", "web", "search", "tavily"]
authors         = [{ name = "Danny Gerst", email = "danny@dannygerst.de" }]
license-files   = ["LICENSE"]
classifiers     = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]

urls = {"Homepage" = "https://www.modelcontextstandard.io", "Source" = "https://github.com/modelcontextstandard/python-sdk"}

dependencies = [
    "mcs-driver-core>=0.4.0",
    "mcs-types-web>=0.1",
]

[project.optional-dependencies]
http = ["mcs-adapter-http>=0.3"]

[tool.uv.sources]
mcs-driver-core   = { workspace = true }
mcs-types-web     = { workspace = true }
mcs-adapter-http  = { workspace = true }

[tool.setuptools.packages.find]
where = ["src"]
