[build-system]
requires = ["setuptools>=63", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name            = "mcs-prompts"
version         = "0.1.0"
description     = "Prompt loading for the Model Context Standard -- per-package defaults, per-model variants, developer overrides."
readme          = "README.md"
requires-python = ">=3.11"
license         = "Apache-2.0"
keywords        = ["mcs", "modelcontextstandard", "prompts", "llm"]
authors         = [{ name = "Danny Gerst", email = "danny@dannygerst.de" }]
license-files   = ["LICENSE"]
classifiers     = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]

urls = {"Homepage" = "https://www.modelcontextstandard.io", "Source" = "https://github.com/modelcontextstandard/python-sdk"}

dependencies = []

[tool.setuptools.packages.find]
where = ["src"]
