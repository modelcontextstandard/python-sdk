[build-system]
requires = ["setuptools>=63", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name            = "mcs-types-summarizer"
version         = "0.1.0"
description     = "Query-focused summarization (SummarizerPort, LLMSummarizer) for the Model Context Standard."
readme          = "README.md"
requires-python = ">=3.9"
license         = "Apache-2.0"
keywords        = ["mcs", "modelcontextstandard", "types", "summarizer", "llm"]
authors         = [{ name = "Danny Gerst", email = "danny@dannygerst.de" }]
license-files   = ["LICENSE"]
classifiers     = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]

urls = {"Homepage" = "https://www.modelcontextstandard.io", "Source" = "https://github.com/modelcontextstandard/python-sdk"}

# The one MCS dependency is itself zero-dependency, so this package stays free of
# third-party ballast -- the LLM arrives injected, never imported.
dependencies = [
    "mcs-types-llm>=0.1",
]

[tool.uv.sources]
mcs-types-llm = { workspace = true }

[tool.setuptools.packages.find]
where = ["src"]
