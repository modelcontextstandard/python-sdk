[project]
name = "mcs-python-sdk"
version = "0.2.2"
description = "Model Context Standard – Python SDK workspace root."
requires-python = ">=3.11"
dependencies = [
  "mcs-driver-core>=0.3.0",
  "mcs-types-http>=0.1",
  "mcs-types-cache>=0.1",
  "mcs-adapter-http>=0.3",
  "mcs-adapter-localfs>=0.1",
  "mcs-adapter-smb>=0.1",
  "mcs-adapter-imap>=0.1",
  "mcs-adapter-smtp>=0.1",
  "mcs-driver-rest>=0.2",
  "mcs-driver-filesystem>=0.2",
  "mcs-driver-csv>=0.1",
  "mcs-driver-mailread>=0.1",
  "mcs-driver-mailsend>=0.1",
  "mcs-driver-mail>=0.1",
  "mcs-orchestrator-base>=0.1",
  "mcs-orchestrator-rest>=0.2",
  "mcs-inspector>=0.1",
  "mcs-auth>=0.1",
  "mcs-auth-auth0>=0.1",
  "mcs-auth-oauth>=0.1",
  "mcs-auth-linkauth>=0.1",
  "mcs-permission>=0.1",
  "mcs-hooks>=0.1",
  "mcs-adapter-docker>=0.1",
  "mcs-adapter-ssh>=0.1",
  "mcs-adapter-mcp>=0.1",
  "mcs-driver-bash>=0.1",
  "mcs-adapter-local>=0.1",
  "mcs-driver-mcp>=0.1",
  "mcs-examples>=0.1",
  "mcs-types-web>=0.1",
  # With [text]: the workspace root is the development environment, so the
  # trafilatura path must be exercised by the suite rather than silently skipped
  # on a fresh checkout. (Markdown is a required dependency, not an extra.)
  "mcs-driver-webfetch[text]>=0.1",
  "mcs-driver-websearch>=0.1",
  "mcs-driver-web>=0.1",
  "mcs-types-llm>=0.1",
  "mcs-adapter-llm>=0.1",
  "mcs-types-summarizer>=0.1",
  "mcs-prompts>=0.1",
]

[tool.uv.sources]
mcs-driver-core = { workspace = true }
mcs-types-http = { workspace = true }
mcs-types-cache = { workspace = true }
mcs-adapter-http = { workspace = true }
mcs-adapter-localfs = { workspace = true }
mcs-adapter-smb = { workspace = true }
mcs-adapter-imap = { workspace = true }
mcs-adapter-smtp = { workspace = true }
mcs-driver-rest = { workspace = true }
mcs-driver-filesystem = { workspace = true }
mcs-driver-csv = { workspace = true }
mcs-driver-mailread = { workspace = true }
mcs-driver-mailsend = { workspace = true }
mcs-driver-mail = { workspace = true }
mcs-orchestrator-base = { workspace = true }
mcs-orchestrator-rest = { workspace = true }
mcs-inspector = { workspace = true }
mcs-auth = { workspace = true }
mcs-auth-auth0 = { workspace = true }
mcs-auth-oauth = { workspace = true }
mcs-auth-linkauth = { workspace = true }
mcs-permission = { workspace = true }
mcs-hooks = { workspace = true }
mcs-adapter-docker = { workspace = true }
mcs-adapter-ssh = { workspace = true }
mcs-adapter-mcp = { workspace = true }
mcs-driver-bash = { workspace = true }
mcs-adapter-local = { workspace = true }
mcs-driver-mcp = { workspace = true }
mcs-examples = { workspace = true }
mcs-types-web = { workspace = true }
mcs-driver-webfetch = { workspace = true }
mcs-driver-websearch = { workspace = true }
mcs-driver-web = { workspace = true }
mcs-types-llm = { workspace = true }
mcs-adapter-llm = { workspace = true }
mcs-types-summarizer = { workspace = true }
mcs-prompts = { workspace = true }

[tool.uv.workspace]
members = [
  "packages/core",
  "packages/inspector",
  "packages/types/*",
  "packages/drivers/*",
  "packages/adapters/*",
  "packages/orchestrators/*",
  "packages/auth/*",
  "packages/permission/*",
  "packages/hooks/*",
  "packages/prompts/*",
  "mcs-examples",
]

[dependency-groups]
dev = [
    "fastapi>=0.128.8",
    "pydantic>=2.12.5",
    "pytest>=8.4.2",
    "uvicorn>=0.39.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
  "pre-commit>=3.8",
  "build>=1.2",
  "twine>=5.1",
  "basedpyright>=1.18",
]
examples = [
  "litellm>=1.40",
  "rich>=13.0",
  "python-dotenv>=1.0",
]

[tool.pytest.ini_options]
# Live tests are *deselected*, not skipped. A skipped test reports as a harmless dot and
# quietly stops guarding anything -- which is exactly how the markdown extraction tests
# went unnoticed for a while. Deselected ones are counted and named in the summary.
addopts = "--import-mode=importlib -m 'not e2e'"
markers = [
  "e2e: needs a live endpoint (an LLM server, a service). Run with `-m e2e`.",
]
